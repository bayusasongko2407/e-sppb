models:
  Plant:
    code: string:20 unique
    name: string:150
    address: text nullable
    is_active: boolean default:true index
    relationships:
      hasMany: Department, Location, User, Asset, WorkflowTemplate, WorkflowDelegation, SppbHeader, RunningNumber, DocumentTemplate, DocumentGeneration, DataImport, DataExport

  Department:
    plant_id: id foreign restrictOnDelete
    code: string:20
    name: string:150
    is_active: boolean default:true index
    indexes:
      - unique: plant_id, code
      - index: plant_id, is_active
    relationships:
      belongsTo: Plant
      hasMany: User, WorkflowTemplate, SppbHeader

  Location:
    plant_id: id foreign restrictOnDelete
    code: string:20
    name: string:150 index
    address: text nullable
    is_active: boolean default:true index
    indexes:
      - unique: plant_id, code
      - index: plant_id, is_active
    relationships:
      belongsTo: Plant
      hasMany: Asset

  Unit:
    code: string:20 unique
    name: string:100
    category: string:50 nullable
    is_active: boolean default:true index
    relationships:
      hasMany: Item, SppbDetail

  Position:
    code: string:30 unique
    name: string:100
    description: text nullable
    is_active: boolean default:true index
    relationships:
      hasMany: UserPosition, WorkflowStep

  User:
    plant_id: id nullable foreign restrictOnDelete
    department_id: id nullable foreign restrictOnDelete
    manager_id: id nullable foreign restrictOnDelete
    nik: string:30 unique
    name: string:150
    email: string:191 nullable unique
    email_verified_at: timestamp nullable
    password: string
    remember_token: rememberToken
    is_active: boolean default:true index
    last_login_at: timestamp nullable
    failed_login_attempts: unsignedInteger default:0
    locked_until: timestamp nullable
    indexes:
      - index: plant_id, department_id, is_active
      - index: manager_id
    relationships:
      belongsTo: Plant, Department, User:manager
      hasMany: UserPosition, User:subordinates, WorkflowStepApprover, WorkflowDelegation:delegationsGiven, WorkflowDelegation:delegationsReceived, SppbHeader:requests, Attachment:uploads, DocumentTemplate:createdDocumentTemplates, DocumentGeneration:generatedDocuments, DocumentGeneration:revokedDocuments, DocumentValidation, DataImport:requestedImports, DataImport:committedImports, DataExport:requestedExports, Notification, ActivityLog

  UserPosition:
    user_id: id foreign cascadeOnDelete
    position_id: id foreign restrictOnDelete
    is_primary: boolean default:false index
    is_active: boolean default:true index
    valid_from: timestamp nullable
    valid_until: timestamp nullable
    indexes:
      - unique: user_id, position_id
      - index: position_id, is_active
    relationships:
      belongsTo: User, Position

  Item:
    code: string:30 unique
    name: string:200
    specification: text nullable
    unit_id: id foreign restrictOnDelete
    # item_type di sini adalah kategori ITEM (bukan kategori aset)
    # Contoh: CONSUMABLE, EQUIPMENT, MATERIAL, SPARE_PART, dll.
    item_category: string:50 nullable index
    is_active: boolean default:true index
    indexes:
      - index: item_category, is_active
    relationships:
      belongsTo: Unit
      hasMany: SppbDetail

  Asset:
    # item_id DIHAPUS: aset berdiri sendiri, bukan turunan item
    # serial_number DIHAPUS: digantikan oleh barcode sebagai identifier unik
    plant_id: id nullable foreign restrictOnDelete
    # location_id tetap sebagai FK ke tabel locations
    # asset_location_name & asset_location_address: snapshot text saat aset disimpan
    # asset_location_data: snapshot text saat aset disimpan
    location_id: id nullable foreign restrictOnDelete
    asset_name: string:1000
    asset_location_data: string:255 nullable
    barcode: string:100 unique
    condition: string:20 default:GOOD index
    status: string:20 default:AVAILABLE index
    unit_id: id foreign restrictOnDelete default:2
    notes: text nullable
    is_active: boolean default:true index
    indexes:
      - index: plant_id, location_id, status, is_active
    relationships:
      belongsTo: Plant, Location
      hasMany: SppbDetail

  WorkflowTemplate:
    uuid: uuid unique
    code: string:30
    name: string:150
    version: unsignedInteger default:1
    plant_id: id nullable foreign restrictOnDelete
    department_id: id nullable foreign restrictOnDelete
    document_type: string:30 default:SPPB
    description: text nullable
    is_active: boolean default:true index
    effective_from: timestamp nullable
    effective_until: timestamp nullable
    indexes:
      - unique: code, version
      - index: document_type, plant_id, department_id, is_active
    relationships:
      belongsTo: Plant, Department
      hasMany: WorkflowStep, WorkflowInstance

  WorkflowStep:
    workflow_template_id: id foreign cascadeOnDelete
    sequence: unsignedInteger
    code: string:30
    name: string:150
    approver_type: string:30
    approver_user_id: id nullable foreign restrictOnDelete
    approver_position_id: id nullable foreign restrictOnDelete
    approver_role: string:100 nullable
    approval_mode: string:20 default:ANY
    minimum_approvals: unsignedInteger default:1
    sla_hours: unsignedInteger nullable
    allow_self_approval: boolean default:false
    is_final: boolean default:false
    configuration: json nullable
    indexes:
      - unique: workflow_template_id, sequence
      - unique: workflow_template_id, code
      - index: approver_position_id
      - index: approver_user_id
    relationships:
      belongsTo: WorkflowTemplate, User:approverUser, Position:approverPosition
      hasMany: WorkflowInstanceStep

  WorkflowDelegation:
    delegator_id: id foreign restrictOnDelete
    delegate_id: id foreign restrictOnDelete
    plant_id: id nullable foreign restrictOnDelete
    starts_at: timestamp
    ends_at: timestamp
    reason: text
    is_active: boolean default:true
    indexes:
      - index: delegator_id, starts_at, ends_at, is_active
      - index: delegate_id, starts_at, ends_at, is_active
    relationships:
      belongsTo: User:delegator, User:delegate, Plant

  SppbHeader:
    uuid: uuid unique
    document_number: string:50 nullable unique
    # UI: plant_id dropdown sesuai hak akses user
    plant_id: id foreign restrictOnDelete
    # UI: department_id autofill berdasarkan departemen user login
    department_id: id foreign restrictOnDelete
    # UI: requester_id autofill nama user login
    requester_id: id foreign restrictOnDelete
    # UI: origin_location_id dropdown difilter berdasarkan plant yang dipilih
    origin_location_id: id foreign restrictOnDelete
    # UI: destination_location_id semua lokasi, tidak boleh sama dengan origin
    destination_location_id: id foreign restrictOnDelete
    # Diganti dari project_name menjadi needed_name
    needed_name: string:255 nullable
    legacy_fppb_hash: char:64 nullable
    legacy_sj_number: string:50 nullable
    request_date: date
    date_needed: date nullable
    purpose: longText
    is_urgent: boolean default:false index
    status: string:30 default:DRAFT index
    revision_no: unsignedInteger default:0
    current_workflow_instance_id: id nullable foreign restrictOnDelete
    current_step_sequence: unsignedInteger nullable
    current_approver_id: id nullable foreign restrictOnDelete
    lock_version: unsignedInteger default:0
    submitted_at: timestamp nullable
    approved_at: timestamp nullable
    rejected_at: timestamp nullable
    cancelled_at: timestamp nullable
    completed_at: timestamp nullable
    rejected_reason: longText nullable
    cancelled_reason: longText nullable
    softDeletes: true
    indexes:
      - index: requester_id, status, created_at
      - index: department_id, status, created_at
      - index: plant_id, status, date_needed
      - index: current_approver_id
    relationships:
      belongsTo: Plant, Department, User:requester, Location:originLocation, Location:destinationLocation, User:currentApprover, WorkflowInstance:currentWorkflowInstance
      hasMany: SppbDetail, WorkflowInstance, SppbStatusLog, Attachment, GoodsRelease, DocumentGeneration

  SppbDetail:
    sppb_header_id: id foreign cascadeOnDelete
    line_no: unsignedInteger
    # barcode_confirmed: jika true → UI dropdown dari tabel assets
    #                   jika false → UI dropdown dari tabel items
    barcode_confirmed: boolean default:false
    # item_id & asset_id: dua FK nullable, hanya salah satu terisi
    item_id: id nullable foreign restrictOnDelete
    asset_id: id nullable foreign restrictOnDelete
    # reference_code: denormalisasi kode untuk tampilan UI (barcode aset / kode item)
    reference_code: string:100 nullable index
    is_from_master: boolean default:false
    # item_type, barcode, item_code, unit_name DIHAPUS
    # item_name diganti menjadi item_asset_name (netral untuk item maupun aset)
    item_asset_name: string:1000
    # unit_id tetap sebagai FK, unit_name dihapus (ambil dari relasi)
    unit_id: id foreign restrictOnDelete
    quantity: decimal:18,2
    # remarks: dapat auto-fill dari specification item jika item dipilih
    #          kosong otomatis jika aset yang dipilih (dapat diedit manual)
    remarks: longText nullable
    # approved_quantity & released_quantity DIHAPUS
    # delivery_status: status pengiriman per detail/item
    # NULL = belum relevan (SPPB belum approved)
    # PENDING = menunggu pengiriman
    # IN_TRANSIT = sedang dikirim
    # DELIVERED = sudah terkirim
    delivery_status: string:20 nullable index
    indexes:
      - unique: sppb_header_id, line_no
      - index: item_id
      - index: asset_id
      - index: unit_id
    relationships:
      belongsTo: SppbHeader, Item, Asset, Unit
      hasMany: GoodsReleaseItem

  WorkflowInstance:
    uuid: uuid unique
    workflow_template_id: id foreign cascadeOnDelete
    sppb_header_id: id foreign cascadeOnDelete
    template_version: unsignedInteger
    revision_no: unsignedInteger default:0
    status: string:30 default:QUEUED index
    current_sequence: unsignedInteger nullable
    started_at: timestamp nullable
    finished_at: timestamp nullable
    failure_code: string:50 nullable
    failure_message: text nullable
    indexes:
      - unique: sppb_header_id, revision_no
      - index: status, current_sequence
    relationships:
      belongsTo: WorkflowTemplate, SppbHeader
      hasMany: WorkflowInstanceStep, SppbStatusLog

  WorkflowInstanceStep:
    workflow_instance_id: id foreign cascadeOnDelete
    workflow_step_id: id nullable foreign restrictOnDelete
    sequence: unsignedInteger
    code: string:30
    name: string:150
    approver_type: string:30
    approval_mode: string:20 default:ANY
    minimum_approvals: unsignedInteger default:1
    sla_hours: unsignedInteger nullable
    status: string:30 default:QUEUED index
    activated_at: timestamp nullable
    due_at: timestamp nullable index
    acted_at: timestamp nullable
    acted_by_id: id nullable foreign restrictOnDelete
    remarks: text nullable
    lock_version: unsignedInteger default:0
    indexes:
      - unique: workflow_instance_id, sequence
      - index: status, due_at
    relationships:
      belongsTo: WorkflowInstance, WorkflowStep, User:actedBy
      hasMany: WorkflowStepApprover, SppbStatusLog

  WorkflowStepApprover:
    workflow_instance_step_id: id foreign cascadeOnDelete
    approver_id: id foreign restrictOnDelete
    delegated_from_id: id nullable foreign restrictOnDelete
    status: string:20 default:QUEUED index
    acted_at: timestamp nullable
    remarks: text nullable
    indexes:
      - unique: workflow_instance_step_id, approver_id
      - index: approver_id, status
    relationships:
      belongsTo: WorkflowInstanceStep, User:approver, User:delegatedFrom

  WorkflowCommand:
    command_uuid: uuid unique
    command_type: string:50
    aggregate_type: string:100
    aggregate_id: unsignedBigInteger
    actor_id: id foreign restrictOnDelete
    payload: json nullable
    status: string:20 default:QUEUED index
    attempts: unsignedInteger default:0
    processed_at: timestamp nullable
    error_code: string:50 nullable
    error_message: text nullable
    indexes:
      - index: aggregate_type, aggregate_id, status
      - index: actor_id, created_at
    relationships:
      belongsTo: User:actor

  SppbStatusLog:
    sppb_header_id: id foreign cascadeOnDelete
    workflow_instance_id: id nullable foreign cascadeOnDelete
    workflow_instance_step_id: id nullable foreign cascadeOnDelete
    actor_id: id nullable foreign restrictOnDelete
    command_uuid: uuid nullable
    action: string:40 index
    from_status: string:30 nullable
    to_status: string:30
    remarks: text nullable
    metadata: json nullable
    correlation_id: uuid nullable index
    logged_at: timestamp index
    indexes:
      - index: sppb_header_id, logged_at
      - index: command_uuid, action
    relationships:
      belongsTo: SppbHeader, WorkflowInstance, WorkflowInstanceStep, User:actor

  Attachment:
    uuid: uuid unique
    sppb_header_id: id foreign cascadeOnDelete
    # sppb_detail_id DIHAPUS: attachment hanya pada level sppb_header
    original_name: string:255
    stored_name: string:255 unique
    disk: string:50 default:private
    directory: string:255
    path: string:500
    mime_type: string:100
    extension: string:20
    file_size: unsignedBigInteger
    checksum_sha256: char:64 index
    uploader_id: id foreign restrictOnDelete
    scan_status: string:20 default:PENDING index
    softDeletes: true
    indexes:
      - index: sppb_header_id, created_at
      - index: uploader_id
    relationships:
      belongsTo: SppbHeader, User:uploader

  DocumentTemplate:
    uuid: uuid unique
    code: string:50
    name: string:150
    document_type: string:30
    version: unsignedInteger default:1
    plant_id: id nullable foreign restrictOnDelete
    renderer: string:50 default:HTML_PDF
    template_path: string:500
    template_checksum_sha256: char:64
    configuration: json nullable
    description: text nullable
    is_active: boolean default:true index
    effective_from: timestamp nullable
    effective_until: timestamp nullable
    created_by_id: id foreign restrictOnDelete
    indexes:
      - unique: code, version
      - index: document_type, plant_id, is_active
      - index: effective_from, effective_until
      - index: created_by_id, created_at
    relationships:
      belongsTo: Plant, User:createdBy
      hasMany: DocumentGeneration

  DocumentGeneration:
    uuid: uuid unique
    command_uuid: uuid unique
    document_template_id: id foreign restrictOnDelete
    template_version: unsignedInteger
    plant_id: id foreign restrictOnDelete
    # Tepat satu sumber wajib terisi. Tambahkan CHECK constraint pada migration korektif.
    sppb_header_id: id nullable foreign restrictOnDelete
    goods_release_id: id nullable foreign restrictOnDelete
    document_type: string:30
    document_number: string:100
    source_revision_no: unsignedInteger default:0
    generation_no: unsignedInteger default:1
    supersedes_id: id nullable foreign restrictOnDelete
    generated_by_id: id foreign restrictOnDelete
    revoked_by_id: id nullable foreign restrictOnDelete
    status: string:30 default:QUEUED index
    is_official: boolean default:false index
    plant_code_snapshot: string:20
    plant_name_snapshot: string:150
    render_payload: json
    source_checksum_sha256: char:64
    disk: string:50 nullable
    directory: string:255 nullable
    stored_name: string:255 nullable unique
    path: string:500 nullable
    mime_type: string:100 nullable
    file_size: unsignedBigInteger nullable
    checksum_sha256: char:64 nullable index
    page_count: unsignedInteger default:0
    processing_started_at: timestamp nullable
    generated_at: timestamp nullable
    expires_at: timestamp nullable
    revoked_at: timestamp nullable
    revocation_reason: text nullable
    error_code: string:50 nullable
    error_message: text nullable
    lock_version: unsignedInteger default:0
    indexes:
      - unique: sppb_header_id, document_type, generation_no
      - unique: goods_release_id, document_type, generation_no
      - index: plant_id, status, generated_at
      - index: document_type, status, created_at
      - index: sppb_header_id, status
      - index: goods_release_id, status
      - index: expires_at, status
      - index: supersedes_id
    relationships:
      belongsTo: DocumentTemplate, Plant, SppbHeader, GoodsRelease, DocumentGeneration:supersedes, User:generatedBy, User:revokedBy
      hasOne: DocumentGeneration:supersededBy
      hasMany: DocumentPage, DocumentValidation

  DocumentPage:
    document_generation_id: id foreign cascadeOnDelete
    verification_uuid: uuid unique
    page_number: unsignedInteger
    page_checksum_sha256: char:64
    qr_payload_checksum_sha256: char:64 unique
    verification_token_hash: char:64 unique
    indexes:
      - unique: document_generation_id, page_number
      - index: page_checksum_sha256
    relationships:
      belongsTo: DocumentGeneration
      hasMany: DocumentValidation

  DocumentValidation:
    uuid: uuid unique
    document_generation_id: id nullable foreign restrictOnDelete
    document_page_id: id nullable foreign restrictOnDelete
    actor_id: id nullable foreign restrictOnDelete
    validation_result: string:20 index
    verification_channel: string:20 default:PUBLIC_QR index
    lookup_fingerprint_sha256: char:64 nullable index
    request_fingerprint_sha256: char:64 nullable
    ip_address_hash_sha256: char:64 nullable
    user_agent_hash_sha256: char:64 nullable
    correlation_id: uuid nullable index
    verified_at: timestamp index
    metadata: json nullable
    indexes:
      - index: document_generation_id, verified_at
      - index: document_page_id, verified_at
      - index: validation_result, verified_at
      - index: lookup_fingerprint_sha256, verified_at
    relationships:
      belongsTo: DocumentGeneration, DocumentPage, User:actor

  DataImport:
    uuid: uuid unique
    command_uuid: uuid unique
    commit_command_uuid: uuid nullable unique
    plant_id: id nullable foreign restrictOnDelete
    requested_by_id: id foreign restrictOnDelete
    committed_by_id: id nullable foreign restrictOnDelete
    import_type: string:50
    schema_version: unsignedInteger default:1
    status: string:30 default:UPLOADED index
    scan_status: string:20 default:PENDING index
    original_name: string:255
    stored_name: string:255 unique
    disk: string:50 default:private
    directory: string:255
    path: string:500
    mime_type: string:100
    extension: string:20
    file_size: unsignedBigInteger
    checksum_sha256: char:64 index
    scope_snapshot: json nullable
    options: json nullable
    total_rows: unsignedBigInteger default:0
    valid_rows: unsignedBigInteger default:0
    invalid_rows: unsignedBigInteger default:0
    processed_rows: unsignedBigInteger default:0
    successful_rows: unsignedBigInteger default:0
    failed_rows: unsignedBigInteger default:0
    validation_report_disk: string:50 nullable
    validation_report_path: string:500 nullable
    validation_report_checksum_sha256: char:64 nullable
    validation_started_at: timestamp nullable
    validated_at: timestamp nullable
    processing_started_at: timestamp nullable
    completed_at: timestamp nullable
    expires_at: timestamp nullable
    error_code: string:50 nullable
    error_message: text nullable
    lock_version: unsignedInteger default:0
    indexes:
      - index: plant_id, import_type, status
      - index: requested_by_id, status, created_at
      - index: committed_by_id, completed_at
      - index: expires_at, status
    relationships:
      belongsTo: Plant, User:requestedBy, User:committedBy

  DataExport:
    uuid: uuid unique
    command_uuid: uuid unique
    plant_id: id nullable foreign restrictOnDelete
    requested_by_id: id foreign restrictOnDelete
    export_type: string:50
    dataset: string:100
    schema_version: unsignedInteger default:1
    format: string:20
    status: string:30 default:QUEUED index
    scope_snapshot: json
    filters: json nullable
    columns: json
    options: json nullable
    disk: string:50 nullable
    directory: string:255 nullable
    stored_name: string:255 nullable unique
    path: string:500 nullable
    mime_type: string:100 nullable
    file_size: unsignedBigInteger nullable
    checksum_sha256: char:64 nullable index
    total_rows: unsignedBigInteger default:0
    processed_rows: unsignedBigInteger default:0
    download_count: unsignedInteger default:0
    processing_started_at: timestamp nullable
    completed_at: timestamp nullable
    expires_at: timestamp nullable
    last_downloaded_at: timestamp nullable
    error_code: string:50 nullable
    error_message: text nullable
    lock_version: unsignedInteger default:0
    indexes:
      - index: plant_id, export_type, status
      - index: requested_by_id, status, created_at
      - index: dataset, format, status
      - index: expires_at, status
    relationships:
      belongsTo: Plant, User:requestedBy

  ActivityLog:
    actor_id: id nullable foreign restrictOnDelete
    module: string:50
    action: string:50
    subject_type: string:100 nullable
    subject_id: unsignedBigInteger nullable
    description: text nullable
    old_values: json nullable
    new_values: json nullable
    ip_address: string:45 nullable
    user_agent: longText nullable
    correlation_id: uuid nullable index
    indexes:
      - index: subject_type, subject_id
      - index: actor_id, created_at
      - index: module, action, created_at
    relationships:
      belongsTo: User:actor

  RunningNumber:
    plant_id: id foreign restrictOnDelete
    # department_id: ditambahkan untuk mendukung format nomor berbasis departemen
    # Format masa depan: SPPB/[PLANT_CODE]/[DEPT_CODE]/[YEAR]/[SEQ]
    department_id: id nullable foreign restrictOnDelete
    document_type: string:30
    period_key: string:12
    prefix: string:30
    digits: unsignedTinyInteger default:4
    last_number: unsignedBigInteger default:0
    lock_version: unsignedInteger default:0
    is_active: boolean default:true index
    indexes:
      - unique: plant_id, document_type, period_key
      - index: document_type, period_key, is_active
    relationships:
      belongsTo: Plant, Department

  GoodsRelease:
    uuid: uuid unique
    release_number: string:50 unique
    manual_release_number: string:50 nullable
    sppb_header_id: id foreign cascadeOnDelete
    release_sequence: unsignedInteger
    is_manual: boolean default:false
    created_by_id: id foreign restrictOnDelete
    sender_name: string:255
    sender_address: text nullable
    receiver_name: string:255
    receiver_address: text nullable
    sender_user_id: id nullable foreign restrictOnDelete
    receiver_user_id: id nullable foreign restrictOnDelete
    driver_name: string:100 nullable
    vehicle_number: string:50 nullable
    expedition_name: string:100 nullable
    delivery_date: date nullable
    received_at: timestamp nullable
    received_by_id: id nullable foreign restrictOnDelete
    status: string:20 default:DRAFT index
    notes: text nullable
    verification_hash: char:64 unique
    indexes:
      - unique: sppb_header_id, release_sequence
      - index: status, delivery_date
    relationships:
      belongsTo: SppbHeader, User:createdBy, User:senderUser, User:receiverUser, User:receivedBy
      hasMany: GoodsReleaseItem, DocumentGeneration

  GoodsReleaseItem:
    goods_release_id: id foreign cascadeOnDelete
    sppb_detail_id: id foreign cascadeOnDelete
    quantity_requested: decimal:18,2
    quantity_released: decimal:18,2
    quantity_received: decimal:18,2 default:0
    condition_on_release: string:20 nullable
    condition_on_receipt: string:20 nullable
    is_checked: boolean default:false
    notes: text nullable
    indexes:
      - unique: goods_release_id, sppb_detail_id
      - index: sppb_detail_id
    relationships:
      belongsTo: GoodsRelease, SppbDetail

  Notification:
    user_id: id foreign cascadeOnDelete
    notification_type: string:30
    title: string:200
    message: longText
    url: string:500 nullable
    is_read: boolean default:false index
    read_at: timestamp nullable
    indexes:
      - index: user_id, is_read, created_at
      - index: notification_type
    relationships:
      belongsTo: User

  LegacyReference:
    source_system: string:50
    source_table: string:100
    legacy_id: string:100
    target_type: string:100
    target_id: unsignedBigInteger
    raw_hash: char:64 nullable
    migrated_at: timestamp
    indexes:
      - unique: source_system, source_table, legacy_id
      - index: target_type, target_id

  EnumControl:
    table_name: string:50
    column_name: string:50
    value: string:100
    label: string:150
    sequence: unsignedInteger default:0
    is_active: boolean default:true index
    description: text nullable
    indexes:
      - unique: table_name, column_name, value
      - index: table_name, column_name, is_active

seeders: Plant, Department, Location, Unit, Position, User, Item, WorkflowTemplate, DocumentTemplate
